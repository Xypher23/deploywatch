name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on Python 3.11
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploywatch
          POSTGRES_PASSWORD: deploywatch
          POSTGRES_DB: deploywatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deploywatch -d deploywatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests on SQLite (in memory)
        run: pytest -v

      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://deploywatch:deploywatch@localhost:5432/deploywatch
        run: pytest -v

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (app + PostgreSQL)
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "App did not become healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Dashboard loads
        run: curl -f http://localhost:8000/ > /dev/null

      - name: Shut down
        if: always()
        run: docker compose down -v
