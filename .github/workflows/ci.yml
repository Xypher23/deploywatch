name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python 3.11
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploywatch
          POSTGRES_PASSWORD: deploywatch
          POSTGRES_DB: deploywatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deploywatch -d deploywatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with SQLite (fast)
        env:
          DATABASE_URL: sqlite:///:memory:
        run: pytest -v

      - name: Run tests with PostgreSQL (integration)
        env:
          DATABASE_URL: postgresql://deploywatch:deploywatch@localhost:5432/deploywatch
        run: pytest -v

      - name: Lint with Ruff (optional)
        if: always()
        run: |
          pip install ruff
          ruff check .

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deploywatch:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-app -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            deploywatch:test
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-app
          docker rm test-app

  compose:
    name: Test Docker Compose stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              echo "All services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy"
          docker compose logs
          exit 1

      - name: Test app endpoint
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/

      - name: Run tests in container
        run: docker compose exec -T app pytest -v

      - name: Shutdown
        run: docker compose down -v