services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://deploywatch:deploywatch@postgres:5432/deploywatch
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Run as single instance to prevent duplicate scheduled checks
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=deploywatch
      - POSTGRES_PASSWORD=deploywatch
      - POSTGRES_DB=deploywatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploywatch -d deploywatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: